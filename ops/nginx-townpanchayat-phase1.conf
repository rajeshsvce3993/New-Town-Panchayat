# Phase 1 nginx site block — paste into /etc/nginx/conf.d/townpan.conf (server only).
# Requires: Node on 127.0.0.1:5000 + health sidecar on 127.0.0.1:5001 (server.js).
#
# Rate limits: add these ONCE in /etc/nginx/nginx.conf inside http { } (not in conf.d):
#   limit_req_zone $binary_remote_addr zone=portal_state:10m rate=25r/s;
#   limit_req_zone $binary_remote_addr zone=api_general:10m rate=80r/s;
# (Place them just before: include /etc/nginx/conf.d/*.conf;)

server {
    server_name townpanchayat.com www.townpanchayat.com;
    client_max_body_size 128m;

    # Health monitor — always hits lightweight sidecar (not saturated :5000)
    location = /api/health {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:5001/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    # Broken relative media URLs (e.g. /1/api/media from pagination path) → real proxy
    location ~ ^/[0-9]+/api/media {
        rewrite ^/[0-9]+(/api/media.*)$ $1 break;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Login / auth must stay reachable when portal-state floods :5000
    location ^~ /api/auth/ {
        limit_req zone=api_general burst=200 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Mobile hotspot — shed load before Node accept queue fills
    location /api/portal-state {
        limit_req zone=portal_state burst=50 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

  location / {
        limit_req zone=api_general burst=120 nodelay;
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/townpanchayat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/townpanchayat.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}